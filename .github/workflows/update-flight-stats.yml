name: Update flight stats

on:
  schedule:
    - cron: '0 13 * * 1' # Every Monday at 13:00 UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme-with-flight-stats:
    name: Update README with latest DJI flight stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout private flight data repo
        uses: actions/checkout@v4
        with:
          repository: rcubillo/dji-flight-log-github
          token: ${{ secrets.FLIGHT_DATA_TOKEN }}
          path: flight-data
          sparse-checkout: |
            data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README flight stats section
        run: node scripts/update-flight-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update flight stats [skip ci]"
          git push
